<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NEON HEIST</title>
<style>
:root{--bg:#05010f;--fg:#e8f6ff;--c1:#00f0ff;--c2:#ff2bd6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;touch-action:none}

.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;background:rgba(5,1,15,.55);text-align:center;overflow:auto}
h1{font-size:clamp(46px,16vw,84px);line-height:.9;margin:0 0 6px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 12px var(--c1),0 0 34px var(--c1),3px 0 var(--c2);animation:p 2s infinite}
@keyframes p{50%{text-shadow:0 0 18px var(--c2),0 0 40px var(--c2),-3px 0 var(--c1)}}

.b{width:min(86vw,340px);min-height:56px;border:2px solid var(--c1);background:rgba(0,240,255,.08);color:#fff;font:800 19px system-ui;letter-spacing:2px;border-radius:14px;box-shadow:0 0 16px rgba(0,240,255,.35),inset 0 0 12px rgba(0,240,255,.15)}
.b:active{transform:scale(.97);background:rgba(0,240,255,.25)}
.b.m{border-color:var(--c2);box-shadow:0 0 16px rgba(255,43,214,.4),inset 0 0 12px rgba(255,43,214,.15)}

</style></head><body>
<canvas id="gl"></canvas><canvas id="c"></canvas>
<button id="pb" onclick="tp()">❚❚</button>
<div id="menu" class="ov"><h1>NEON<br>HEIST</h1><p id="mi"></p>
<button class="b" onclick="start(0)">PLAY</button><button class="b m" onclick="start(1)">DAILY HEIST</button>
<button class="b" onclick="shop()">UPGRADES</button><button class="b" onclick="cust()">CUSTOMIZE</button>
<button class="b g" id="gq" onclick="gq()">GRAPHICS: AUTO</button><button class="b g" id="sn" onclick="snd()">SOUND ON</button></div>
<div id="pn" class="ov"></div><div id="ov" class="ov"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== CONFIG: tweak difficulty, speed, rewards, colors here =====
const CFG={v0:30,vmax:64,acc:.45,sec:1.1,hit:16,ext:2300,pur:[800,1700],purLen:12,core:10,cd:7,
 chars:[["RUNNER","#00f0ff",0],["CYBER NINJA","#ff2bd6",300],["GHOST HACKER","#9dff00",600],["NEON MERC","#ffb000",1000]],
 ups:{sh:["START SHIELD",[200]],mg:["MAGNET TIME",[150,300,500]],sl:["SECURITY SLOW",[200,400,700]]},
 pw:{S:["#00f0ff","sh","SHIELD"],M:["#ffe600","mg","MAGNET"],T:["#3b82ff","fr","TIME FREEZE"],O:["#ff8a00","od","OVERDRIVE"],G:["#ffffff","gh","GHOST"],D:["#ff3355","dn","DASH READY"]}};
// ===== SAVE =====
let S;try{S=JSON.parse(localStorage.getItem('nh'))}catch(e){}
S=Object.assign({best:0,cr:0,own:[0],ch:0,up:{},daily:{},tut:0,snd:1},S||{});
const save=()=>{try{localStorage.setItem('nh',JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),today=()=>new Date().toISOString().slice(0,10);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ===== AUDIO (procedural; swap bp() calls for samples later) =====
let AC;function ac(){if(!AC&&S.snd){try{AC=new(window.AudioContext||webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
function bp(f,d=.1,t='square',v=.05,s=0){if(!AC||!S.snd)return;const T=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,T);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(T+d)}
function sfx(k){const m={core:()=>bp(600+Math.min(G.st,30)*25,.08,'triangle',.07),dash:()=>bp(200,.3,'sawtooth',.06,600),sh:()=>bp(900,.25,'sine',.08,-500),hit:()=>bp(120,.3,'sawtooth',.1,-80),pw:()=>{bp(500,.1,'square',.05);setTimeout(()=>bp(900,.15,'square',.05),80)},near:()=>bp(1200,.1,'triangle',.06,600),win:()=>[400,500,600,800].forEach((f,i)=>setTimeout(()=>bp(f,.25,'triangle',.08),i*110)),lose:()=>bp(300,.8,'sawtooth',.1,-250),mv:()=>bp(300,.04,'triangle',.03)};m[k]&&m[k]()}
let mi=0,mt;function music(){clearTimeout(mt);if(mode!='play')return;const s=G.sec,n=[55,55,82,55,65,55,82,98][mi%8];if(!paused){bp(n*(s>60?2:1),.12,'sawtooth',.03);if(s>35&&mi%2)bp(3000,.03,'square',.012);if(s>70&&mi%4==0)bp(110,.1,'square',.03)}mi++;mt=setTimeout(music,Math.max(85,175-s*.9))}
function snd(){S.snd=S.snd?0:1;save();$('sn').textContent=S.snd?'SOUND ON':'SOUND OFF';ac()}
// ===== CANVAS =====
const cv=$('c'),x=cv.getContext('2d');let W,H,hy,py,dpr=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);hy=H*.3;py=H*.8}
addEventListener('resize',rs);rs();
const P=z=>{const p=Math.max(0,1-z/90);return[hy+(py-hy)*p,.1+.9*p]},LX=(l,s)=>W/2+(l-1)*W*.3*s;
// ===== STATE =====
let G,mode='menu',paused=false,rnd=Math.random,isDaily=false,LR={};const parts=[];
const ri=n=>Math.floor(rnd()*n),KS='SMTOGD';
function newG(){return{t:0,d:0,sp:CFG.v0,sc:0,co:0,st:0,bc:1,sec:0,lane:1,lx:1,j:0,sl:0,ents:[],nz:30,pc:0,sh:0,mg:0,fr:0,od:0,gh:0,dash:0,cd:0,inv:0,risk:0,pur:0,pa:0,shk:0,fl:0,txt:[],same:0,pl:1,end:0,tut:0,ml:1}}
G=newG();
function show(id){['menu','pn','ov'].forEach(i=>$(i).style.display=i==id?'flex':'none');$('pb').style.display=id==null?'block':'none'}
function menu(){mode='menu';G=newG();$('mi').innerHTML='BEST '+S.best.toLocaleString()+' · CREDITS '+S.cr+'<br>DAILY BEST '+(S.daily[today()]||0).toLocaleString();show('menu')}
function start(dl){ac();isDaily=dl;rnd=dl?rng(hash(today())):Math.random;G=newG();G.sh=S.up.sh?1:0;G.tut=S.tut?0:1;S.tut=1;save();parts.length=0;paused=false;mode='play';show(null);mi=0;music()}
function tp(){if(mode!='play')return;paused=!paused}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode=='play')paused=true});
// ===== LEVEL GENERATION: reusable segments, always leave a safe line =====
const add=(t,z,o)=>G.ents.push(Object.assign({t,wz:z},o));
const PAT=[
(z)=>{const l=ri(3);for(let i=0;i<8;i++)add('core',z+i*3,{l});return 28},
(z)=>{const g=ri(3);add('wall',z+8,{ls:[0,1,2].filter(l=>l!=g)});for(let i=0;i<5;i++)add('core',z+i*3,{l:g});return 28},
(z)=>{add('laser',z+8,{});for(let i=0;i<4;i++)add('core',z+4+i*3,{l:ri(3)});return 26},
(z,d)=>{add('drone',z+8,{dl:1,ph:rnd()*6,a:1+d*1.2});const l=ri(3);for(let i=0;i<6;i++)add('core',z+i*4,{l});return 30},
(z)=>{add('low',z+8,{});for(let i=0;i<3;i++)add('core',z+5+i*2,{l:1});return 24},
(z)=>{for(let i=0;i<8;i++)add('core',z+i*3,{l:[0,1,2,1][i%4]});return 28},
(z)=>{const g=ri(3);add('wall',z+6,{ls:[0,1,2].filter(l=>l!=g)});add('laser',z+22,{});add('core',z+14,{l:g});return 38},
(z,d)=>{add('drone',z+8,{dl:0,ph:0,a:1.2+d});add('drone',z+8,{dl:2,ph:3.1,a:1.2+d});for(let i=0;i<5;i++)add('core',z+i*4,{l:1});return 32},
(z)=>{const tl=ri(3);add('sniper',z+10,{l:tl,sd:ri(2)?3:-1});for(let i=0;i<6;i++)add('core',z+i*4,{l:(tl+1+ri(2))%3});return 30},
(z)=>{const l=ri(3);add('guard',z+30,{l,ph:rnd()*6});for(let i=0;i<6;i++)add('core',z+i*4,{l:(l+1)%3});return 34}];
const GATE=z=>{add('gate',z+10,{});return 34},PW=z=>{add('pw',z+6,{l:ri(3),k:KS[ri(6)]});for(let i=0;i<4;i++)add('core',z+10+i*3,{l:ri(3)});return 26};
function gen(){const g=G,d=Math.min(1,g.d/CFG.ext*.7+g.sec/200)+(g.risk>0?.25:0);g.pc++;let p;
 if(g.pc<3)p=PAT[g.pc-1==0?0:5];else if(g.pc%6==0)p=GATE;else if(g.pc%4==0)p=PW;
 else{const pool=d<.2?[0,0,1,2,5]:d<.5?[0,1,2,3,4,5,1,9]:[1,2,3,4,6,7,3,6,8,9];p=PAT[pool[ri(pool.length)]]}
 g.nz+=p(g.nz,d)*(g.pur>0?.8:1)}
// ===== EFFECTS =====
const ft=(s,c,xx,yy)=>G.txt.push({s,x:xx??W/2,y:yy??H*.45,t:1,c:c||'#fff'});
function burst2d(xx,yy,c,n=10){for(let i=0;i<n&&parts.length<140;i++){const a=Math.random()*6.28,v=40+Math.random()*160;parts.push({x:xx,y:yy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5,c})}}
const mult=()=>{const s=G.st;return(s>=40?10:s>=24?5:s>=14?4:s>=7?3:s>=3?2:1)*(G.od>0?2:1)};
function coll(e,s,y){const g=G,o=mult();g.st++;g.co++;const m=mult(),v=CFG.core*(g.risk>0?3:1)*(g.pur>0?2:1)*m;g.sc+=v;g.bc=Math.max(g.bc,m);
 const xx=LX(e.l,s);burst(xx,y-20,'#00f0ff',6);sfx('core');if(m>o){ft('COMBO x'+m+'!','#ff2bd6',W/2,H*.38);g.fl=.12}}
function hitp(e){const g=G;e.x=1;g.inv=1;if(g.sh){g.sh=0;sfx('sh');burst(LX(g.lx,1),py-30,'#00f0ff',24);ft('SHIELD BROKEN','#00f0ff')}
 else{g.sec+=CFG.hit;g.st=0;g.shk=.4;g.fl=.3;sfx('hit');burst(LX(g.lx,1),py-30,'#ff2255',30);ft('HIT! +SECURITY','#ff2255')}}
function ability(){const g=G;if(mode!='play'||paused||g.cd>0||g.dash>0)return;g.dash=.7;g.cd=CFG.cd;g.shk=.2;sfx('dash');ft('DASH','#ff3355')}
// ===== UPDATE =====
function upd(dt){const g=G;g.t+=dt;const f=g.fr>0?.35:1;
 for(const k of['mg','fr','od','gh','inv','risk','pur','dash','shk','fl','cd','j','sl'])g[k]=Math.max(0,g[k]-dt);
 const tg=Math.min(CFG.vmax,CFG.v0+g.t*CFG.acc)*(g.od>0?1.25:1)*(g.risk>0?1.3:1)*(g.dash>0?1.8:1)*(g.pur>0?1.2:1);
 g.sp+=(tg-g.sp)*Math.min(1,dt*4);g.d+=g.sp*dt;g.sc+=g.sp*dt*.5*mult();g.lx+=(g.lane-g.lx)*Math.min(1,dt*16);
 for(let i=0;i<2;i++)if(g.d>=CFG.pur[i]&&!g['p'+i]){g['p'+i]=1;g.pur=CFG.purLen;g.pa=1;ft('SECURITY PURSUIT!','#ff2255',W/2,H*.3);g.shk=.6;g.fl=.4;sfx('hit')}
 if(g.pa&&g.pur<=0){g.pa=0;g.sc+=5000;ft('ESCAPED +5000','#9dff00');sfx('win')}
 if(g.lane!=g.pl){g.pl=g.lane;g.same=0}else g.same+=dt;
 g.sec+=(CFG.sec*(.6+g.d/CFG.ext)*(g.pur>0?1.5:1)*(1-.08*(S.up.sl||0))+(g.same>3.5?1.5:0))*dt;
 if(g.sec>=100){g.sec=100;end(0);return}
 while(g.nz<g.d+95&&g.nz<CFG.ext-20)gen();
 if(!g.portal&&g.nz>=CFG.ext-20){g.portal=1;add('portal',CFG.ext,{})}
 const ghost=g.gh>0||g.dash>0,ht=Math.sin(Math.PI*g.j/.55);
 for(const e of g.ents){const rz=e.wz-g.d;if(e.t=='drone'){e.ph+=dt*e.a*f;e.dl=1+Math.sin(e.ph)*1.1}if(e.t=='guard'&&rz<60)e.wz-=16*dt*f;
  if(e.x||rz>12)continue;const t=e.t,[y,s]=P(rz);
  if(t=='core'){if((rz<1.5&&rz>-1.5&&Math.abs(e.l-g.lx)<.7)||(g.mg>0&&Math.abs(e.l-g.lx)<1.6)){e.x=1;coll(e,s,y)}continue}
  if(t=='pw'){if(rz<1.5&&rz>-1.5&&Math.abs(e.l-g.lx)<.8){e.x=1;pick(e.k)}continue}
  if(t=='gate'){if(rz<0){e.x=1;if(g.lx>1.5){g.risk=10;g.co+=300;g.sc+=3000;ft('HIGH RISK +300 CORES  3x','#ff3355')}else{g.co+=100;g.sc+=1000;ft('SAFE +100 CORES','#00f0ff')}}continue}
  if(t=='portal'){if(rz<.5){g.sc+=0;end(1);return}continue}
  if(t=='sniper'){if(rz<6&&!e.f){e.f=1;if(Math.abs(g.lx-e.l)<.6&&!(g.gh>0||g.dash>0)&&g.inv<=0)hitp(e);else{ft('SNIPER MISSED','#ffe600',W/2,H*.52);g.st+=2;sfx('near')}}continue}
  if(Math.abs(rz)<1.2){let h=0;if(t=='wall')h=e.ls.includes(Math.round(g.lx))&&ht<.8;else if(t=='laser')h=g.sl<=0;else if(t=='low')h=ht<.35;else if(t=='drone')h=Math.abs(e.dl-g.lx)<.6;else if(t=='guard')h=Math.abs(e.l-g.lx)<.6&&ht<.4;
   if(h){if(g.dash>0){e.x=1;g.sc+=200;burst(LX(e.l??g.lx,s),y-30,'#ff3355',16)}else if(!ghost&&g.inv<=0)hitp(e)}}
  if(!e.x&&rz<-1.3&&!e.n){e.n=1;if((t=='drone'&&Math.abs(e.dl-g.lx)<1.2)||(t=='laser'&&g.sl>0)||(t=='low'&&g.j>0)){g.st+=2;g.sc+=50*mult();g.sec=Math.max(0,g.sec-1.5);ft('NEAR MISS','#ffe600',W/2,H*.52);sfx('near');g.fl=.08}}}
 g.ents=g.ents.filter(e=>e.wz-g.d>-8&&!e.x);
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);
 for(const q of g.txt){q.t-=dt*1.1;q.y-=dt*40}g.txt=g.txt.filter(q=>q.t>0);
 if(Math.random()<.5)parts.push({x:LX(g.lx,1)+(Math.random()-.5)*20,y:py,vx:0,vy:60,l:.35,c:CFG.chars[S.ch][1]})}
function pick(k){const[c,n,nm]=CFG.pw[k],g=G;sfx('pw');if(n=='sh')g.sh=1;else if(n=='dn')g.cd=0;else g[n]={mg:8+2*(S.up.mg||0),fr:5,od:6,gh:4}[n];ft(nm,c);burst(LX(g.lx,1),py-30,c,16)}
function end(w){const g=G;if(g.end)return;g.end=1;mode='over';clearTimeout(mt);$('pb').style.display='none';
 if(w)g.sc+=Math.round((100-g.sec)*60)+2000;const sc=Math.floor(g.sc),cr=Math.floor(sc/200)+(w?250:0),nb=sc>S.best;
 S.cr+=cr;if(nb)S.best=sc;if(isDaily&&sc>(S.daily[today()]||0))S.daily[today()]=sc;save();sfx(w?'win':'lose');g.shk=.5;
 LR={w,tm:g.t.toFixed(1),sc,bc:g.bc,co:g.co,cr,nb};
 setTimeout(()=>{$('ov').innerHTML=`<h2>NEON HEIST</h2><div class="big">${w?'EXTRACTED IN':'CAUGHT AFTER'}<br>${LR.tm} SECONDS</div><p style="font-size:20px;color:#fff;margin-top:8px">SCORE ${sc.toLocaleString()}${nb?' ★ NEW BEST':''}</p><p>BEST COMBO x${g.bc} · CORES ${g.co} · +${cr} CREDITS</p><p>${isDaily?'DAILY HEIST · BEST '+S.daily[today()].toLocaleString():'BEST '+S.best.toLocaleString()}</p><h2 style="color:#ff2bd6;margin:8px 0">CAN YOU BEAT ME?</h2><button class="b m" onclick="share()" id="sh">SHARE</button><button class="b" onclick="start(${isDaily?1:0})">RETRY</button><button class="b g" onclick="menu()">MENU</button>`;show('ov')},w?700:900)}
function share(){const t=`NEON HEIST ⚡\n${LR.w?'EXTRACTED IN':'CAUGHT AFTER'} ${LR.tm}s\nSCORE ${LR.sc.toLocaleString()} · COMBO x${LR.bc} · ${LR.co} CORES${isDaily?' (DAILY HEIST)':''}\nCAN YOU BEAT ME?`,u=location.href.split('#')[0];
 if(navigator.share)navigator.share({title:'NEON HEIST',text:t,url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t+'\n'+u).then(()=>{$('sh').textContent='COPIED ✓'}).catch(()=>{$('sh').textContent=t});else $('sh').textContent='Screenshot to share!'}
// ===== MENUS =====
function shop(){let h=`<h2>UPGRADES</h2><p>CREDITS ${S.cr}</p>`;for(const k in CFG.ups){const[n,c]=CFG.ups[k],l=S.up[k]||0,co=c[l];h+=`<button class="b" ${co==null||S.cr<co?'disabled':''} onclick="buy('${k}')">${n} ${l}/${c.length}${co!=null?' · '+co:' · MAX'}</button>`}$('pn').innerHTML=h+'<button class="b g" onclick="menu()">BACK</button>';show('pn')}
function buy(k){const c=CFG.ups[k][1],l=S.up[k]||0;if(c[l]!=null&&S.cr>=c[l]){S.cr-=c[l];S.up[k]=l+1;save();shop()}}
function cust(){let h=`<h2>CUSTOMIZE</h2><p>CREDITS ${S.cr}</p>`;CFG.chars.forEach((c,i)=>{const o=S.own.includes(i);h+=`<button class="b" style="border-color:${c[1]};color:${c[1]}" ${!o&&S.cr<c[2]?'disabled':''} onclick="pickc(${i})">${c[0]} ${S.ch==i?'✓':o?'':'· '+c[2]}</button>`});$('pn').innerHTML=h+'<button class="b g" onclick="menu()">BACK</button>';show('pn')}
function pickc(i){if(!S.own.includes(i)){if(S.cr<CFG.chars[i][2])return;S.cr-=CFG.chars[i][2];S.own.push(i)}S.ch=i;save();cust()}
// ===== INPUT =====
let sx,sy,fired,down;
const act={L:()=>{G.lane=Math.max(0,G.lane-1);sfx('mv')},R:()=>{G.lane=Math.min(2,G.lane+1);sfx('mv')},U:()=>{if(G.j<=0){G.j=.55;G.sl=0;sfx('mv')}},D:()=>{G.sl=.5;G.j=0}};
function go(k){if(mode=='play'&&!paused)act[k]()}
cv.addEventListener('pointerdown',e=>{ac();if(paused){paused=false;return}sx=e.clientX;sy=e.clientY;fired=0;down=1});
cv.addEventListener('pointermove',e=>{if(!down||fired)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>22||Math.abs(dy)>22){fired=1;go(Math.abs(dx)>Math.abs(dy)?(dx<0?'L':'R'):(dy<0?'U':'D'))}});
cv.addEventListener('pointerup',()=>{if(down&&!fired)ability();down=0});
addEventListener('keydown',e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'};if(m[e.key])go(m[e.key]);else if(e.key==' ')ability();else if(e.key=='p')tp()});
// ===== DRAW =====
const gl=(a,b,r,c,al)=>{x.globalAlpha=al;x.fillStyle=c;x.beginPath();x.arc(a,b,r,0,7);x.fill();x.globalAlpha=1};
function bg(){const g=G,sc=g.sec/100,h=200-sc*200,gc=`hsl(${h},100%,55%)`;
